function openCard(id,colId){
  const isNew=!id;
  const card=isNew?{id:c(),title:'',desc:'',col:colId||'todo',assignees:[],start:'',due:'',tags:[],comments:[],order:state.cards.length}:state.cards.find(x=>x.id===id);
  curEdit=`"${card.title||'새 카드'}" 편집 중…`;overlay.classList.add('open');
  modal.innerHTML=`
    <div class="field"><label>제목</label><input id="mTitle" value="${escAttr(card.title)}" placeholder="카드 제목"></div>
    <div class="field"><label>설명</label><textarea id="mDesc" rows="2">${esc(card.desc)}</textarea></div>
    <div class="grid2">
      <div class="field"><label>시작일</label><input type="date" id="mStart" value="${card.start||''}"></div>
      <div class="field"><label>마감일</label><input type="date" id="mDue" value="${card.due||''}"></div></div>
    <div class="field"><label>상태</label><select id="mCol">${state.columns.map(col=>`<option value="${col.id}" ${col.id===card.col?'selected':''}>${col.title}</option>`).join('')}</select></div>
    <div class="field"><label>담당자</label><div class="chips" id="mAsg">${(state.members||[]).map(m=>`<span class="chip-sel ${card.assignees.includes(m.name)?'on':''}" data-n="${m.name}">${m.name}</span>`).join('')||'<span class="hint" style="margin:0">아직 이 작업공간에 로그인한 사람이 없습니다.</span>'}</div></div>
    <div class="field"><label>태그</label><div class="chips" id="mTags">${TAGS.map(t=>`<span class="chip-sel ${card.tags.includes(t)?'on':''}" data-t="${t}">${t}</span>`).join('')}</div></div>
    <div class="field"><label>카드 색상</label><div class="chips" id="mColors">
      <span class="mtcolor${!card.color?' on':''}" data-c="" title="기본 (마감 상태에 따라 자동 표시)" style="background:var(--panel);border:2px dashed var(--line)"></span>
      ${MEET_COLORS.map(cl=>`<span class="mtcolor${card.color===cl?' on':''}" data-c="${cl}" style="background:${cl}"></span>`).join('')}</div></div>
    <div class="field"><label>댓글 (@이름 으로 멘션)</label><div class="comments" id="mCmts"></div>
      <div style="display:flex;gap:6px;margin-top:6px"><input id="mCmt" placeholder="댓글 입력 후 Enter"></div></div>
    <div class="actions">${isNew?'':'<button class="del" id="mDel">삭제</button>'}<button class="btn ghost" id="mCancel">취소</button><button class="btn" id="mSave">저장</button></div>`;
  modal.querySelector('#mAsg').onclick=e=>{const s=e.target.closest('.chip-sel');if(!s)return;const n=s.dataset.n;s.classList.toggle('on');
    if(card.assignees.includes(n))card.assignees=card.assignees.filter(x=>x!==n);else card.assignees.push(n);};
  modal.querySelector('#mTags').onclick=e=>{const s=e.target.closest('.chip-sel');if(!s)return;const t=s.dataset.t;s.classList.toggle('on');
    if(card.tags.includes(t))card.tags=card.tags.filter(x=>x!==t);else card.tags.push(t);};
  let cardColor=card.color||'';
  modal.querySelector('#mColors').onclick=e=>{const sp=e.target.closest('.mtcolor');if(!sp)return;cardColor=sp.dataset.c;
    modal.querySelectorAll('#mColors .mtcolor').forEach(x=>x.classList.toggle('on',x===sp));};
  function drawCmts(){const box=modal.querySelector('#mCmts');box.innerHTML=card.comments.map(cm=>`<div class="cmt"><div class="who">${cm.who}</div>${mention(cm.text)}</div>`).join('')||'<div class="hint" style="margin:0">아직 댓글이 없습니다.</div>';box.scrollTop=box.scrollHeight;}
  drawCmts();
  modal.querySelector('#mCmt').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=e.target.value.trim();if(!v)return;
    card.comments.push({who:me.name,text:v,ts:Date.now()});
    (state.members||[]).forEach(m=>{if(m.name!==me.name&&v.includes('@'+m.name))pushNoti(m.name,`${me.name}님이 "${card.title||'카드'}"에서 회원님을 멘션했습니다.`);});
    if(isNew&&!state.cards.includes(card))state.cards.push(card);save();refreshBell();e.target.value='';drawCmts();});
  modal.querySelector('#mSave').onclick=()=>{card.title=modal.querySelector('#mTitle').value.trim()||'제목 없음';
    card.desc=modal.querySelector('#mDesc').value;card.col=modal.querySelector('#mCol').value;
    card.start=modal.querySelector('#mStart').value;card.due=modal.querySelector('#mDue').value;card.color=cardColor;
    if(isNew&&!state.cards.includes(card))state.cards.push(card);save();closeModal();render();};
  modal.querySelector('#mCancel').onclick=()=>{closeModal();render();};
  if(!isNew)modal.querySelector('#mDel').onclick=()=>{state.cards=state.cards.filter(x=>x.id!==card.id);save();closeModal();render();};
}
function mention(t){const names=(state.members||[]).map(m=>m.name);
  if(!names.length)return esc(t);
  const alt=names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  return esc(t).replace(new RegExp('@('+alt+')','g'),'<span class="mention">@$1</span>');}

/* ---------- 알림 & 프로필 ---------- */
function pushNoti(to,text){state.notifications.unshift({to,text,ts:Date.now(),read:false});}
function myNotis(){return (state.notifications||[]).filter(x=>me&&x.to===me.name);}
let lastUnread=null; // 직전 안읽음 개수 (증가 감지용 — 로그인 직후 첫 계산에서는 알림 안 띄움)
function refreshBell(){if(!me)return;const un=myNotis().filter(x=>!x.read);const n=un.length;
  const b=document.getElementById('bellBadge');if(!b)return;b.style.display=n?'flex':'none';b.textContent=n;
  // 데스크톱 알림: 탭이 안 보이거나 포커스가 없을 때 새 알림이 늘어나면 OS 알림 표시
  if(lastUnread!==null&&n>lastUnread&&typeof Notification!=='undefined'&&Notification.permission==='granted'
     &&(document.hidden||!document.hasFocus())){
    try{new Notification('Relay',{body:un[0].text,tag:'relay-noti'});}catch(e){}
  }
  lastUnread=n;
  refreshMsgBadge(); // 메신저(채널·DM) 안읽음 배지도 함께 갱신
}
const notiDrop=document.getElementById('notiDrop'),profileDrop=document.getElementById('profileDrop');
document.getElementById('bell').onclick=e=>{e.stopPropagation();profileDrop.classList.remove('open');notiDrop.classList.toggle('open');
  if(notiDrop.classList.contains('open')){const ns=myNotis();
    notiDrop.innerHTML='<div style="font-weight:700;padding:4px 8px">알림</div>'+(ns.length?ns.slice(0,8).map(n=>`<div class="noti">🔔 ${esc(n.text)}<div class="hint" style="margin:2px 0 0">${timeago(n.ts)}</div></div>`).join(''):'<div class="noti hint">새 알림이 없습니다.</div>');
    ns.forEach(n=>n.read=true);save();refreshBell();}};
const SWATCHES=['#2F6BF4','#2FA36B','#EC6A88','#8A63E8','#E0913C','#E5484D','#20A8B8','#7B7D8C'];
function renderProfileDrop(){
  profileDrop.innerHTML=`<div style="display:flex;align-items:center;gap:10px;padding:2px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:8px">
      <div class="me-ava" style="width:38px;height:38px;font-size:15px;background:${me.color};cursor:default">${me.name[0]}</div>
      <div><div style="font-weight:700">${esc(me.name)} ${(allZones().find(z=>z.id===zoneOf(me.name))||{}).e||''}</div><div class="hint" style="margin:0">${esc(me.company||'-')}</div></div>
    </div>
    <div class="hint" style="margin:0 2px 6px">상태 · 위치 <span style="opacity:.7">(위치 현황과 연동)</span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 10px">${allZones().map(z=>
      `<button type="button" class="btn ghost sm${zoneOf(me.name)===z.id?' on':''}" data-zone="${z.id}" title="${escAttr(z.n)}">${z.e}</button>`).join('')}</div>
    <button class="btn ghost sm" id="themeToggleBtn" style="width:100%;margin-bottom:8px;display:flex;justify-content:space-between">🌙 다크 모드<b>${currentTheme()==='dark'?'켜짐':'꺼짐'}</b></button>
    <div class="hint" style="margin:0 2px 6px">아바타 색상</div>
    <div id="colorSwatches" style="display:flex;gap:7px;flex-wrap:wrap;margin:0 2px 10px"></div>
    <button class="btn ghost sm" id="readAllBtn" style="width:100%;margin-bottom:6px">✅ 알림 모두 읽음 처리</button>
    <button class="btn ghost sm" id="logoutBtn" style="width:100%;color:var(--danger)">🚪 로그아웃</button>`;
  profileDrop.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{
    const z=b.dataset.zone;
    state.locations=state.locations||{};state.locations[me.name]={zone:z,ts:Date.now()};
    state.statuses=state.statuses||{};state.statuses[me.name]={s:ZONE_STATUS[z]||'online'};
    save();renderProfileDrop();updatePeers();if(view==='location')render();});
  const sw=profileDrop.querySelector('#colorSwatches');
  SWATCHES.forEach(col=>{const b=document.createElement('button');b.className='swatch'+(col===me.color?' on':'');b.style.background=col;b.title=col;b.type='button';
    b.onclick=()=>{me.color=col;const mine=(state.members||[]).find(x=>x.name===me.name);if(mine)mine.color=col;
      document.getElementById('meAva').style.background=col;save();renderProfileDrop();updatePeers();render();};
    sw.appendChild(b);});
  document.getElementById('themeToggleBtn').onclick=()=>{toggleTheme();renderProfileDrop();};
  document.getElementById('readAllBtn').onclick=()=>{myNotis().forEach(n=>n.read=true);save();refreshBell();};
  document.getElementById('logoutBtn').onclick=logout;
}
document.getElementById('meAva').onclick=e=>{e.stopPropagation();notiDrop.classList.remove('open');profileDrop.classList.toggle('open');
  if(profileDrop.classList.contains('open'))renderProfileDrop();};
document.addEventListener('click',()=>{notiDrop.classList.remove('open');profileDrop.classList.remove('open');});
notiDrop.addEventListener('click',e=>e.stopPropagation());
profileDrop.addEventListener('click',e=>e.stopPropagation());
function logout(){
  profileDrop.classList.remove('open');
  if(es){try{es.close();}catch(err){}es=null;}
  msgPop.classList.remove('open');chatWith=null;booted=false;me=null;state=null;authToken=null;lastUnread=null;
  serverPeers=[];for(const k in peers)delete peers[k];drawCursors();
  document.getElementById('hdr').style.display='none';
  document.getElementById('main').style.display='none';
  document.getElementById('msgFab').style.display='none';
  document.getElementById('loginCode').value='';
  document.getElementById('join').style.display='flex';
}

/* ==================== 메신저 (채널 + 1:1 DM) ==================== */
let chatWith=null; // null=목록 / 'ch::<id>'=채널 / 그 외=1:1 상대 이름
const msgFab=document.getElementById('msgFab'),msgPop=document.getElementById('msgPop'),msgBody=document.getElementById('msgBody'),msgBack=document.getElementById('msgBack'),msgTitle=document.getElementById('msgTitle');
msgFab.onclick=()=>{msgPop.classList.toggle('open');if(msgPop.classList.contains('open'))syncMsgPop();};
msgBack.onclick=()=>{chatWith=null;syncMsgPop();};
function chatKey(a,b){return [a,b].sort().join('|');}
function chatMsgs(key){return (state&&state.chats&&state.chats[key])||[];}
// 안읽음: 마지막 확인 시각을 브라우저(localStorage)에 사람·대화방 단위로 기록
function lastReadKey(key){return 'tfread::'+wsKey()+'::'+me.name+'::'+key;}
function unread(key){const lr=+(lsGet(lastReadKey(key))||0);return chatMsgs(key).filter(m=>m.from!==me.name&&m.ts>lr).length;}
function markRead(key){lsSet(lastReadKey(key),String(Date.now()));refreshMsgBadge();}
function refreshMsgBadge(){
  if(!me||!state)return;const b=document.getElementById('msgBadge');if(!b)return;
  let n=0;
  (state.channels||[]).forEach(ch=>n+=unread('ch::'+ch.id));
  (state.members||[]).forEach(m=>{if(m.name!==me.name)n+=unread(chatKey(me.name,m.name));});
  b.style.display=n?'flex':'none';b.textContent=n>99?'99+':n;
}
function syncMsgPop(){
  if(!msgPop.classList.contains('open'))return;
  if(!chatWith){ // 목록 (채널 + 팀원)
    msgBack.style.display='none';msgTitle.textContent='메신저';
    msgBody.className='msg-list';msgBody.removeAttribute('style');msgBody.innerHTML='';
    // 채널 섹션
    const secCh=document.createElement('div');secCh.className='msg-sec';
    secCh.innerHTML=`채널<button id="chAdd" title="채널 만들기">＋</button>`;
    msgBody.appendChild(secCh);
    secCh.querySelector('#chAdd').onclick=()=>{
      const t=prompt('새 채널 이름');if(!t||!t.trim())return;
      state.channels.push({id:c(),name:t.trim()});save();syncMsgPop();};
    (state.channels||[]).forEach(ch=>{
      const key='ch::'+ch.id;const msgs=chatMsgs(key);const last=msgs[msgs.length-1];const un=unread(key);
      const el=document.createElement('div');el.className='msg-contact';
      el.innerHTML=`<div class="a" style="background:var(--surface2);color:var(--ink)">#</div><div class="info"><div class="nm"># ${esc(ch.name)}</div>
        <div class="last">${last?esc(last.from+': '+last.text):'채널 대화를 시작해보세요'}</div></div>${un?`<span class="unread">${un}</span>`:''}`;
      el.onclick=()=>{chatWith=key;syncMsgPop();};msgBody.appendChild(el);});
    // 팀원 DM 섹션
    const secDm=document.createElement('div');secDm.className='msg-sec';secDm.textContent='팀원';msgBody.appendChild(secDm);
    const contacts=(state.members||[]).filter(m=>m.name!==me.name);
    if(!contacts.length){const h=document.createElement('div');h.className='hint';h.style.padding='6px 16px';h.textContent='아직 이 작업공간에 로그인한 다른 팀원이 없습니다.';msgBody.appendChild(h);}
    contacts.forEach(m=>{
      const key=chatKey(me.name,m.name);const msgs=chatMsgs(key);const last=msgs[msgs.length-1];const un=unread(key);
      const el=document.createElement('div');el.className='msg-contact';
      el.innerHTML=`<div class="a" style="background:${m.color}">${m.name[0]}</div><div class="info"><div class="nm">${statusEmoji(m.name)} ${esc(m.name)}</div>
        <div class="last">${last?esc(last.text):'대화를 시작해보세요'}</div></div>${un?`<span class="unread">${un}</span>`:''}`;
      el.onclick=()=>{chatWith=m.name;syncMsgPop();};msgBody.appendChild(el);});
  }else{ // 대화창 (채널/1:1 공용)
    const isCh=chatWith.startsWith('ch::');
    const ch=isCh?(state.channels||[]).find(x=>'ch::'+x.id===chatWith):null;
    if(isCh&&!ch){chatWith=null;syncMsgPop();return;}
    msgBack.style.display='inline';
    msgTitle.textContent=isCh?'# '+ch.name:statusEmoji(chatWith)+' '+chatWith;
    const key=isCh?chatWith:chatKey(me.name,chatWith);const msgs=chatMsgs(key);
    msgBody.className='';msgBody.style.display='flex';msgBody.style.flexDirection='column';msgBody.style.flex='1';msgBody.style.overflow='hidden';
    msgBody.innerHTML=`<div class="chat" id="chatArea"></div>
      <div class="chat-in"><input id="chatIn" placeholder="${isCh?'#'+escAttr(ch.name)+' 에 메시지 (@이름 멘션)':'메시지 입력…'}"><button id="chatSend">전송</button></div>`;
    const area=msgBody.querySelector('#chatArea');
    area.innerHTML=msgs.map(m=>`<div class="bubble ${m.from===me.name?'me':'you'}">${m.from!==me.name?`<div class="who">${m.from}</div>`:''}${esc(m.text)}</div>`).join('');
    area.scrollTop=area.scrollHeight;
    markRead(key);
    const send=()=>{const v=msgBody.querySelector('#chatIn').value.trim();if(!v)return;
      (state.chats[key]=state.chats[key]||[]).push({from:me.name,text:v,ts:Date.now()});
      if(isCh){ // 채널은 @멘션된 사람에게만 알림 (전체 알림 소음 방지)
        (state.members||[]).forEach(m=>{if(m.name!==me.name&&v.includes('@'+m.name))pushNoti(m.name,`#${ch.name} 채널에서 ${me.name}님이 회원님을 멘션했습니다.`);});
      }else{
        pushNoti(chatWith,`${me.name}님이 메시지를 보냈습니다: "${v.length>24?v.slice(0,24)+'…':v}"`);
      }
      save();refreshBell();markRead(key);syncMsgPop();};
    msgBody.querySelector('#chatSend').onclick=send;
    msgBody.querySelector('#chatIn').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
    msgBody.querySelector('#chatIn').focus();
  }
}

function afterFirstState(){if(booted)return;booted=true;
  ensureMember();
  document.getElementById('join').style.display='none';
  document.getElementById('hdr').style.display='flex';
  document.getElementById('main').style.display='block';
  document.getElementById('msgFab').style.display='block';
  bindViews();updatePeers();refreshBell();render();
  try{checkMeetingReminders();}catch(e){}}
(function loginScreen(){
  const companySel=document.getElementById('loginCompany'),deptSel=document.getElementById('loginDept'),nameSel=document.getElementById('loginName');
  const codeInput=document.getElementById('loginCode');
  function fillCompanies(){
    companySel.innerHTML='<option value="">회사를 선택하세요</option>';
    Object.keys(ORG_LIST).forEach(co=>{const o=document.createElement('option');o.value=co;o.textContent=co;companySel.appendChild(o);});
    // 저장된 이전 로그인 정보로 미리 채움
    try{const saved=JSON.parse(lsGet(LOGIN_LS)||'null');
      if(saved&&ORG_LIST[saved.company]){
        companySel.value=saved.company;fillDepts(saved.company);
        if(saved.dept&&ORG_LIST[saved.company].includes(saved.dept))deptSel.value=saved.dept;
        nameSel.value=saved.name||'';
      }
    }catch(e){}
  }
  function fillDepts(co){
    deptSel.innerHTML='';
    if(co&&ORG_LIST[co]){
      deptSel.innerHTML='<option value="">부서를 선택하세요</option>';
      ORG_LIST[co].forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;deptSel.appendChild(o);});
      deptSel.disabled=false;
    }else{
      deptSel.innerHTML='<option value="">회사를 먼저 선택하세요</option>';
      deptSel.disabled=true;
    }
  }
  companySel.addEventListener('change',()=>fillDepts(companySel.value));
  if(MODE==='server'){
    document.getElementById('joinDesc').textContent='회사명·부서명을 선택하고 부서 코드를 입력해 로그인하세요. 같은 서버 접속자와 실시간으로 함께 편집합니다.';
    document.getElementById('joinStatus').textContent='🟢 서버 연결 가능';
    // 조직 목록 로드. 응답이 JSON이 아니면 협업 서버(server.js)가 아닌 정적 서버(라이브 서버 등)로 연 것
    (function loadOrgs(){
      fetch('/orgs').then(r=>{
        const ct=r.headers.get('content-type')||'';
        if(!r.ok||ct.indexOf('json')<0)throw {wrongServer:true};
        return r.json();
      }).then(o=>{
        ORG_LIST=o;fillCompanies();
        document.getElementById('loginErr').style.display='none';
      }).catch(err=>{
        if(err&&err.wrongServer){
          loginError('⚠️ 이 주소는 협업 서버가 아닙니다 (라이브 서버/정적 호스팅으로 열림). 터미널에서 "node server.js"를 실행한 뒤 http://localhost:3000 으로 접속해주세요.');
        }else{
          loginError('서버에서 조직 정보를 불러오는 중입니다… 잠시 후 자동으로 다시 시도합니다.');
          setTimeout(loadOrgs,3000);
        }
      });
    })();
  }else{
    // 로컬(file://) 데모 모드: 서버가 없으므로 데모 조직 + 부서 코드 검증 생략
    ORG_LIST=DEMO_ORGS;fillCompanies();
    codeInput.closest('.field').style.display='none';
    document.getElementById('joinDesc').textContent='로컬 데모 모드입니다. 회사·부서를 선택하고 이름을 입력하세요. (부서 코드 검증 없음)';
    document.getElementById('joinStatus').textContent='⚪ 로컬 데모 — 실제 협업은 node server.js 후 http://localhost:3000';
  }
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const company=companySel.value;
    const dept=deptSel.value;
    const name=nameSel.value.trim();
    const code=codeInput.value.trim();
    const err=document.getElementById('loginErr');
    if(!company||!dept||!name||(MODE==='server'&&!code)){err.textContent='모든 항목을 선택/입력해주세요.';err.style.display='block';return;}
    if(MODE==='server'){
      // 부서 코드 검증은 서버에서만 — 성공 시 세션 토큰 발급
      let j=null;
      try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company,dept,name,code})});j=await r.json();}
      catch(ex){err.textContent='서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.';err.style.display='block';return;}
      if(!j||!j.ok){err.textContent=(j&&j.error)||'로그인에 실패했습니다.';err.style.display='block';return;}
      authToken=j.token;
    }
    err.style.display='none';
    me={id:c(),name,color:colorFor(name),company,dept};
    lsSet(LOGIN_LS,JSON.stringify({company,dept,name}));
    // 데스크톱 알림 권한 요청 (로그인 클릭 = 사용자 제스처 시점이라 브라우저가 허용)
    try{if(typeof Notification!=='undefined'&&Notification.permission==='default')Notification.requestPermission();}catch(ex){}
    const a=document.getElementById('meAva');a.textContent=me.name[0];a.style.background=me.color;a.title='나: '+me.name;
    connect();
  });
})();
</script>
</body>
</html>
